<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>관리자 로그인 — REAL-Edu</title><link rel="stylesheet" href="admin.css"><script src="admin-access.js"></script><style>body{min-height:100svh;display:grid;place-items:center;padding:24px}.login-card{width:min(100%,440px);background:#171922;border:1px solid #ffffff20;border-radius:12px;padding:32px}.login-card h1{font-size:28px;margin:32px 0 12px}.login-card p{color:#a9abba;line-height:1.8;font-size:13px}.login-card label{display:grid;gap:8px;margin:20px 0;font-size:13px}.login-card input{width:100%;padding:12px;color:#fff;background:#0d0f16;border:1px solid #ffffff30;border-radius:5px;font:inherit}.login-card button{width:100%;margin-top:10px}.demo-account{background:#222432;border-radius:6px;padding:14px;font-size:12px;line-height:1.9}.login-card a{color:#b6aaff}.login-card [role=alert]{color:#ffa9b5}</style></head><body><main class="login-card"><a class="brand" href="./"><span>R</span>REAL-Edu <small>ADMIN</small></a><h1>관리자 로그인</h1><p>강좌와 캠페인, 플랫폼 운영을 한곳에서.</p><div class="demo-account">로그인 UI 체험용 계정<br>이메일: admin@example.com<br>비밀번호: realedu-demo</div><form id="admin-login-form"><label>관리자 이메일<input name="email" type="email" required autocomplete="off" placeholder="admin@example.com"></label><label>비밀번호<input name="password" type="password" required autocomplete="off" placeholder="테스트 비밀번호"></label><p id="login-message" role="alert"></p><button class="primary" type="submit">테스트 계정으로 로그인 →</button></form><p>현재는 화면 흐름을 확인하는 데모입니다. 실제 인증이나 접근 보호가 아니며, 실제 비밀번호를 입력하지 마세요. 체험 세션은 30분 후 종료됩니다.</p><a href="./">← 홈페이지로 돌아가기</a></main></body></html>
